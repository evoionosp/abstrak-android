name: Release APK
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  GRADLE_ARGS: --stacktrace
jobs:
  check-release:
    name: Check release schedule
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check daily limit and new commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY_UTC=$(date -u +%F)
          LATEST_RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)
          if [ -z "$LATEST_RELEASE" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUBLISHED_AT=$(printf '%s' "$LATEST_RELEASE" | jq -r '.published_at // empty')
          LATEST_TAG=$(printf '%s' "$LATEST_RELEASE" | jq -r '.tag_name // empty')
          if [ -n "$PUBLISHED_AT" ] && [ "$(date -u -d "$PUBLISHED_AT" +%F)" = "$TODAY_UTC" ]; then
            echo "A release has already been published today (UTC); skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$LATEST_TAG" ] && git rev-parse -q --verify "refs/tags/$LATEST_TAG" >/dev/null; then
            if [ -z "$(git log -1 --format=%H "$LATEST_TAG..HEAD")" ]; then
              echo "No commits since $LATEST_TAG; skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
  build-and-release:
    name: Build release APK & publish GitHub Release
    needs: check-release
    if: needs.check-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Configure release signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured — release will use debug signing (sideload-only)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > keystore.properties <<EOF2
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF2
          echo "Release signing configured from secrets."
      - name: Assemble release
        run: ./gradlew $GRADLE_ARGS assembleRelease
      - name: Prepare release metadata
        id: meta
        run: |
          VERSION_NAME=$(grep '^versionName' gradle/libs.versions.toml | cut -d'"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${VERSION_NAME}-${{ github.run_number }}"
          APK_NAME="abstrak-${TAG}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Abstrak ${{ steps.meta.outputs.tag }} (${{ steps.meta.outputs.sha }})" \
            --generate-notes \
            --latest \
            "${{ steps.meta.outputs.apk }}#Abstrak release APK"
