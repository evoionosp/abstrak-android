name: Android CI
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
permissions:
  contents: read
env:
  GRADLE_ARGS: --stacktrace
jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: true
      - name: ktlint
        run: ./gradlew $GRADLE_ARGS ktlintCheck
      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew $GRADLE_ARGS :app:lintDebug
      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
          retention-days: 14
          if-no-files-found: ignore
  unit-tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - name: Run unit tests with coverage
        run: ./gradlew $GRADLE_ARGS testDebugUnitTest koverXmlReport koverHtmlReport koverVerify
      - name: Summarise test results
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ci_summary.py tests
      - name: Summarise coverage
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ci_summary.py coverage
      - name: Comment coverage on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_summary.py comment "${{ github.event.number }}"
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 14
          if-no-files-found: warn
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/reports/kover/html/**
            build/reports/kover/report.xml
          retention-days: 14
          if-no-files-found: warn
  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: true
      - name: Assemble debug
        run: ./gradlew $GRADLE_ARGS assembleDebug
      - name: Assemble release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: ./gradlew $GRADLE_ARGS assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn
